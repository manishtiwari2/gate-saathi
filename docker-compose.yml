# Local Postgres for development. Production uses Supabase (see docs/DEPLOY.md).
#   docker compose up -d     # start
#   docker compose down      # stop (data is kept in the named volume)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gate
      POSTGRES_PASSWORD: gate
      POSTGRES_DB: gate_saathi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate -d gate_saathi"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
