name: Deploy

# Builds a production bundle on pushes to main. Wire in your host of choice:
# - Vercel: add the Vercel GitHub integration (recommended for the Next.js app),
#   or set VERCEL_TOKEN/ORG/PROJECT secrets and swap the final step for
#   `npx vercel deploy --prod --token=$VERCEL_TOKEN`.
# - A Node host (needed if you run the Socket-style polling + a long-lived
#   server): build here, then deploy the output with your host's action.
#
# Note: the study-room/library presence uses in-process state, so a single
# long-running Node instance is required (not serverless fan-out) if you want
# presence to be consistent. Vercel works for everything except cross-instance
# presence sharing; use a single instance or move presence to a shared store.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_SECRET: "ci-placeholder-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Create the schema and seed data so build-time prerendering of
      # database-backed pages (e.g. /cutoffs) has tables to query.
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 7
