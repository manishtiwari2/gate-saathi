# Render: the backup host. It runs the same app from the same repo and the
# same Supabase/Upstash, ready to take over if Netlify is paused or down.
# Free services sleep after ~15 minutes idle. Setup: docs/DEPLOY.md.
services:
  - type: web
    name: gate-saathi
    runtime: node
    plan: free
    # Next to the Supabase database (US East, Ohio).
    region: ohio
    buildCommand: npm ci && npm run build:deploy
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Secrets: set in the Render dashboard, never here.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
